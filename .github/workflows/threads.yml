name: 스레드 자동 발행
on:
  schedule:
    - cron: "7 * * * *"   # 매시 7분마다 발행 대기열 확인
  workflow_dispatch: {}     # 수동 실행 버튼
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 발행
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python scripts/post_threads.py
      - name: 발행 기록 저장
        run: |
          git config user.name "tcg-bot"
          git config user.email "tcg-bot@users.noreply.github.com"
          git add -A threads
          git diff --cached --quiet || git commit -m "스레드 발행 기록" && git push
